<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#123a66" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="団子販売" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>学園祭 団子販売カウンター</title>
  <style>
    :root{
      --navy:#123a66;
      --navy2:#0e2d50;
      --bg:#eef2f6;
      --card:#ffffff;
      --line:#d9e0e7;
      --text:#17202a;
      --muted:#6b7785;
      --shoyu:#9b5c2b;
      --mitarashi:#d98b11;
      --green:#148441;
      --green2:#0f6b34;
      --red:#b3261e;
      --shadow:0 8px 24px rgba(20,40,60,.10);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--text)}
    body{min-height:100vh}
    button,input{font:inherit}
    .app{max-width:1180px;margin:0 auto;min-height:100vh;background:#fff}
    header{
      background:linear-gradient(180deg,var(--navy),var(--navy2));
      color:white;padding:16px 20px 14px;text-align:center;position:sticky;top:0;z-index:10
    }
    header h1{font-size:30px;line-height:1.15;margin:0;font-weight:800;letter-spacing:.03em}
    header .sub{font-size:16px;margin-top:4px;opacity:.92}
    .main{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;padding:16px;background:var(--bg)}
    .left,.right{min-width:0}
    .order-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .sku-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
    .sku-head{color:white;font-size:34px;font-weight:800;text-align:center;padding:14px 12px}
    .sku-head.shoyu{background:linear-gradient(180deg,#a76737,#855023)}
    .sku-head.mitarashi{background:linear-gradient(180deg,#efa729,#ca7903)}
    .sku-body{padding:16px}
    .unit{text-align:center;font-size:20px;font-weight:700;margin-bottom:12px}
    .stepper{display:grid;grid-template-columns:88px 1fr 88px;align-items:center;gap:10px}
    .stepper button{
      height:88px;border-radius:18px;border:2px solid #c9d1da;background:#fff;font-size:54px;line-height:1;font-weight:500;
      touch-action:manipulation;
    }
    .stepper button:active{transform:scale(.98);background:#f3f6f9}
    .qty{font-size:68px;line-height:1;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
    .line-total{text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:22px;font-weight:800}
    .summary{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:0;box-shadow:var(--shadow)}
    .sum-cell{text-align:center;padding:6px 14px}
    .sum-cell + .sum-cell{border-left:1px solid var(--line)}
    .sum-label{font-size:20px;font-weight:700}
    .sum-value{display:inline-block;font-size:54px;font-weight:900;margin-left:10px;font-variant-numeric:tabular-nums}
    .sum-unit{font-size:22px;font-weight:700}
    .actions{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:16px}
    .primary,.secondary,.danger,.smallbtn{
      border:0;border-radius:16px;font-weight:800;touch-action:manipulation;cursor:pointer;
    }
    .primary{height:82px;background:linear-gradient(180deg,var(--green),var(--green2));color:white;font-size:32px;box-shadow:var(--shadow)}
    .primary:disabled{opacity:.4}
    .secondary{height:82px;background:#fff;color:var(--red);border:2px solid #df6b65;font-size:23px}
    .right-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
    .right-card h2{font-size:20px;margin:0 0 10px}
    .recent{display:flex;flex-direction:column;gap:0}
    .recent-row{padding:10px 0;border-top:1px solid var(--line)}
    .recent-row:first-child{border-top:0}
    .recent-top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
    .recent-main{font-size:15px;font-weight:700;margin-top:3px}
    .recent-total{font-size:17px;font-weight:800;margin-top:2px}
    .empty{color:var(--muted);padding:16px 4px;text-align:center}
    .stats{margin:16px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
    .stats-top{display:grid;grid-template-columns:auto 1fr 1fr 1fr 1.2fr;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:800}
    .badge{background:#e8f0f8;color:var(--navy);border:1px solid #c9d7e6;border-radius:8px;padding:7px 10px;text-align:center}
    .stat{text-align:center;font-size:18px}.stat strong{font-size:24px;margin-left:4px;font-variant-numeric:tabular-nums}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:600px}
    th{background:var(--navy);color:white;padding:10px;text-align:center}
    td{padding:10px;border-top:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
    .footer-actions{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px 16px;flex-wrap:wrap}
    .smallbtn{padding:12px 16px;background:#fff;border:1px solid #bfc9d4;color:var(--navy);font-size:16px}
    .smallbtn.export{border-color:#60a47a;color:#176b37}
    .smallbtn.undo{border-color:#d59b96;color:#9b2d25}
    .toast{
      position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
      background:rgba(20,26,32,.94);color:white;padding:14px 20px;border-radius:12px;
      opacity:0;pointer-events:none;transition:.2s;z-index:50;font-weight:700
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .confirm-flash{animation:flash .35s ease}
    @keyframes flash{0%{transform:scale(1)}50%{transform:scale(.985)}100%{transform:scale(1)}}
    .note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
    input[type=file]{display:none}
    @media (max-width:900px){
      .main{grid-template-columns:1fr}
      .right{order:2}
      .stats{margin:0 16px 16px}
    }
    @media (max-width:680px){
      header h1{font-size:23px}
      .order-grid{grid-template-columns:1fr}
      .sku-head{font-size:28px}
      .qty{font-size:56px}
      .stepper{grid-template-columns:76px 1fr 76px}
      .stepper button{height:76px;font-size:46px}
      .summary{grid-template-columns:1fr}
      .sum-cell + .sum-cell{border-left:0;border-top:1px solid var(--line)}
      .actions{grid-template-columns:1fr}
      .stats-top{grid-template-columns:1fr 1fr}
      .stats-top .badge{grid-column:1/-1}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>学園祭 模擬店売上記録</h1>
    <div class="sub">団子販売カウンター ｜ 現金決済のみ</div>
  </header>

  <section class="main">
    <div class="left">
      <div class="order-grid">
        <article class="sku-card">
          <div class="sku-head shoyu">しょうゆ</div>
          <div class="sku-body">
            <div class="unit">1本 120円</div>
            <div class="stepper">
              <button aria-label="しょうゆを1本減らす" onclick="changeQty('shoyu',-1)">−</button>
              <div class="qty" id="qShoyu">0</div>
              <button aria-label="しょうゆを1本増やす" onclick="changeQty('shoyu',1)">＋</button>
            </div>
            <div class="line-total"><span id="shoyuCalc">120円 × 0 = 0円</span></div>
          </div>
        </article>

        <article class="sku-card">
          <div class="sku-head mitarashi">みたらし</div>
          <div class="sku-body">
            <div class="unit">1本 120円</div>
            <div class="stepper">
              <button aria-label="みたらしを1本減らす" onclick="changeQty('mitarashi',-1)">−</button>
              <div class="qty" id="qMitarashi">0</div>
              <button aria-label="みたらしを1本増やす" onclick="changeQty('mitarashi',1)">＋</button>
            </div>
            <div class="line-total"><span id="mitarashiCalc">120円 × 0 = 0円</span></div>
          </div>
        </article>
      </div>

      <div class="summary" id="summaryBox">
        <div class="sum-cell">
          <span class="sum-label">合計</span>
          <span class="sum-value" id="orderQty">0</span><span class="sum-unit">本</span>
        </div>
        <div class="sum-cell">
          <span class="sum-label">お会計</span>
          <span class="sum-value">¥<span id="orderPrice">0</span></span>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="confirmBtn" onclick="confirmSale()" disabled>✓ 販売確定</button>
        <button class="secondary" onclick="resetOrder()">注文取消・リセット</button>
      </div>
    </div>

    <aside class="right">
      <div class="right-card">
        <h2>最近の記録</h2>
        <div class="recent" id="recentList"></div>
        <div class="note">販売確定時の時刻を自動保存します。</div>
      </div>
    </aside>
  </section>

  <section class="stats">
    <div class="stats-top">
      <div class="badge">本日累計</div>
      <div class="stat">しょうゆ <strong id="totalShoyu">0</strong>本</div>
      <div class="stat">みたらし <strong id="totalMitarashi">0</strong>本</div>
      <div class="stat">合計 <strong id="totalQty">0</strong>本</div>
      <div class="stat">売上 <strong>¥<span id="totalSales">0</span></strong></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>時間帯</th><th>しょうゆ</th><th>みたらし</th><th>合計</th><th>売上</th></tr>
        </thead>
        <tbody id="hourlyBody"></tbody>
      </table>
    </div>

    <div class="footer-actions">
      <button class="smallbtn undo" onclick="undoLast()">直前の取引を取消</button>
      <button class="smallbtn export" onclick="exportCSV()">CSV出力（スナップショット）</button>
      <label class="smallbtn" for="csvImport">CSVから復元</label>
      <input type="file" id="csvImport" accept=".csv,text/csv" onchange="importCSV(event)" />
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const PRICE = 120;
let order = { shoyu:0, mitarashi:0 };
let db;

function money(n){ return Number(n).toLocaleString('ja-JP'); }
function pad(n){ return String(n).padStart(2,'0'); }
function localDateKey(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isoLocal(d=new Date()){
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function newTxId(d=new Date()){
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
}

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('DangoPOS',1);
    req.onupgradeneeded=e=>{
      const database=e.target.result;
      if(!database.objectStoreNames.contains('transactions')){
        const store=database.createObjectStore('transactions',{keyPath:'id'});
        store.createIndex('timestamp','timestamp');
        store.createIndex('dateKey','dateKey');
      }
    };
    req.onsuccess=e=>{db=e.target.result; resolve(db);}
    req.onerror=()=>reject(req.error);
  });
}
function storeTx(tx){
  return new Promise((resolve,reject)=>{
    const t=db.transaction('transactions','readwrite');
    t.objectStore('transactions').put(tx);
    t.oncomplete=resolve;
    t.onerror=()=>reject(t.error);
  });
}
function deleteTx(id){
  return new Promise((resolve,reject)=>{
    const t=db.transaction('transactions','readwrite');
    t.objectStore('transactions').delete(id);
    t.oncomplete=resolve;
    t.onerror=()=>reject(t.error);
  });
}
function clearTxs(){
  return new Promise((resolve,reject)=>{
    const t=db.transaction('transactions','readwrite');
    t.objectStore('transactions').clear();
    t.oncomplete=resolve;
    t.onerror=()=>reject(t.error);
  });
}
function allTxs(){
  return new Promise((resolve,reject)=>{
    const t=db.transaction('transactions','readonly');
    const r=t.objectStore('transactions').getAll();
    r.onsuccess=()=>resolve(r.result.sort((a,b)=>a.timestamp.localeCompare(b.timestamp)));
    r.onerror=()=>reject(r.error);
  });
}

function changeQty(sku,delta){
  order[sku]=Math.max(0, order[sku]+delta);
  renderOrder();
}
function resetOrder(){
  order={shoyu:0,mitarashi:0};
  renderOrder();
}
function renderOrder(){
  document.getElementById('qShoyu').textContent=order.shoyu;
  document.getElementById('qMitarashi').textContent=order.mitarashi;
  document.getElementById('shoyuCalc').textContent=`120円 × ${order.shoyu} = ${money(order.shoyu*PRICE)}円`;
  document.getElementById('mitarashiCalc').textContent=`120円 × ${order.mitarashi} = ${money(order.mitarashi*PRICE)}円`;
  const qty=order.shoyu+order.mitarashi;
  document.getElementById('orderQty').textContent=qty;
  document.getElementById('orderPrice').textContent=money(qty*PRICE);
  document.getElementById('confirmBtn').disabled = qty===0;
}

async function confirmSale(){
  const qty=order.shoyu+order.mitarashi;
  if(qty===0) return;
  const now=new Date();
  const tx={
    id:newTxId(now),
    timestamp:isoLocal(now),
    dateKey:localDateKey(now),
    shoyu:Number(order.shoyu),
    mitarashi:Number(order.mitarashi),
    totalQty:qty,
    totalPrice:qty*PRICE
  };
  await storeTx(tx);
  resetOrder();
  document.getElementById('summaryBox').classList.remove('confirm-flash');
  void document.getElementById('summaryBox').offsetWidth;
  document.getElementById('summaryBox').classList.add('confirm-flash');
  toast(`販売記録：${qty}本 / ¥${money(qty*PRICE)}`);
  await refresh();
}

async function refresh(){
  const all=await allTxs();
  const today=localDateKey();
  const txs=all.filter(x=>x.dateKey===today);
  const shoyu=txs.reduce((s,x)=>s+Number(x.shoyu||0),0);
  const mita=txs.reduce((s,x)=>s+Number(x.mitarashi||0),0);
  const qty=shoyu+mita;
  document.getElementById('totalShoyu').textContent=shoyu;
  document.getElementById('totalMitarashi').textContent=mita;
  document.getElementById('totalQty').textContent=qty;
  document.getElementById('totalSales').textContent=money(qty*PRICE);

  const recent=[...txs].reverse().slice(0,5);
  const list=document.getElementById('recentList');
  list.innerHTML='';
  if(!recent.length){list.innerHTML='<div class="empty">まだ販売記録がありません</div>';}
  recent.forEach(x=>{
    const time=x.timestamp.slice(11,16);
    const parts=[];
    if(x.shoyu) parts.push(`しょうゆ${x.shoyu}`);
    if(x.mitarashi) parts.push(`みたらし${x.mitarashi}`);
    const div=document.createElement('div');
    div.className='recent-row';
    div.innerHTML=`<div class="recent-top"><span>${time}</span><span>${x.id.slice(-4)}</span></div>
      <div class="recent-main">${parts.join(' / ')}</div>
      <div class="recent-total">${x.totalQty}本　¥${money(x.totalPrice)}</div>`;
    list.appendChild(div);
  });

  const hourly={};
  txs.forEach(x=>{
    const h=Number(x.timestamp.slice(11,13));
    if(!hourly[h]) hourly[h]={shoyu:0,mitarashi:0};
    hourly[h].shoyu += Number(x.shoyu||0);
    hourly[h].mitarashi += Number(x.mitarashi||0);
  });
  const body=document.getElementById('hourlyBody');
  body.innerHTML='';
  const hours=Object.keys(hourly).map(Number).sort((a,b)=>a-b);
  if(!hours.length){
    body.innerHTML='<tr><td colspan="5" style="color:#6b7785">販売確定すると時間帯別集計が表示されます</td></tr>';
  }else{
    hours.forEach(h=>{
      const a=hourly[h], q=a.shoyu+a.mitarashi;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${pad(h)}:00–${pad((h+1)%24)}:00</td><td>${a.shoyu}</td><td>${a.mitarashi}</td><td>${q}</td><td>¥${money(q*PRICE)}</td>`;
      body.appendChild(tr);
    });
  }
}

async function undoLast(){
  const txs=(await allTxs()).filter(x=>x.dateKey===localDateKey());
  if(!txs.length){toast('取消できる取引がありません');return;}
  const last=txs[txs.length-1];
  const parts=[];
  if(last.shoyu) parts.push(`しょうゆ${last.shoyu}本`);
  if(last.mitarashi) parts.push(`みたらし${last.mitarashi}本`);
  if(!confirm(`直前の取引を取消しますか？\n${last.timestamp.slice(11,16)} / ${parts.join('・')} / ¥${money(last.totalPrice)}`)) return;
  await deleteTx(last.id);
  toast('直前の取引を取り消しました');
  await refresh();
}

async function exportCSV(){
  const txs=await allTxs();
  const headers=['record_type','timestamp','transaction_id','shoyu_qty','mitarashi_qty','total_qty','unit_price','total_price'];
  const lines=[headers.join(',')];
  txs.forEach(x=>{
    lines.push([
      'SALE', x.timestamp, x.id, x.shoyu, x.mitarashi, x.totalQty, PRICE, x.totalPrice
    ].join(','));
  });
  const csv='\uFEFF'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const now=new Date();
  const filename=`dango_sales_${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.csv`;
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`CSVを出力しました：${filename}`);
}

function parseCSVLine(line){
  // This app exports unquoted numeric/simple fields only.
  return line.split(',');
}
async function importCSV(event){
  const file=event.target.files && event.target.files[0];
  event.target.value='';
  if(!file) return;
  if(!confirm(`「${file.name}」の内容で現在の販売履歴を置き換えます。\n先に現在データをCSV出力しておくことを推奨します。\n続行しますか？`)) return;
  try{
    const text=(await file.text()).replace(/^\uFEFF/,'').trim();
    const lines=text.split(/\r?\n/).filter(Boolean);
    if(lines.length<1) throw new Error('CSVが空です');
    const header=parseCSVLine(lines[0]);
    const expected=['record_type','timestamp','transaction_id','shoyu_qty','mitarashi_qty','total_qty','unit_price','total_price'];
    if(expected.some((h,i)=>header[i]!==h)) throw new Error('このアプリのCSV形式ではありません');
    const rows=[];
    for(let i=1;i<lines.length;i++){
      const c=parseCSVLine(lines[i]);
      if(c[0]!=='SALE') continue;
      const ts=c[1], id=c[2], sh=Number(c[3]), mi=Number(c[4]), tq=Number(c[5]), up=Number(c[6]), tp=Number(c[7]);
      if(!ts || !id || [sh,mi,tq,up,tp].some(Number.isNaN)) throw new Error(`${i+1}行目の形式が不正です`);
      rows.push({id,timestamp:ts,dateKey:ts.slice(0,10),shoyu:sh,mitarashi:mi,totalQty:tq,totalPrice:tp});
    }
    await clearTxs();
    for(const r of rows) await storeTx(r);
    toast(`${rows.length}件の取引を復元しました`);
    await refresh();
  }catch(e){
    alert('CSV復元に失敗しました。\n'+e.message);
  }
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

window.addEventListener('load', async ()=>{
  try{
    await openDB();
    renderOrder();
    await refresh();
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
  }catch(e){
    alert('アプリの保存領域を初期化できませんでした。\n'+e.message);
  }
});
</script>
</body>
</html>
